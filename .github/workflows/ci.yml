name: CI

on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Test, compile iOS, and build documentation
        run: scripts/validate.sh
      - name: Package documentation
        run: tar -czf SwiftBits-Documentation.tar.gz -C .build/documentation/Build/Products/Debug SwiftBits.doccarchive
      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: SwiftBits-Documentation
          path: SwiftBits-Documentation.tar.gz
          if-no-files-found: error
